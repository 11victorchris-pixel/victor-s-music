<head>

<meta name="description" content="Log in to your Vic Musical Store account to track orders faster.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<body data-page="login">
<a class="skip-link" href="#vmMain">Skip to content</a>
<div class="topbar" id="vmTopbar"></div>
<header class="site-header" id="vmHeader"></header>

<main id="vmMain">
  <section class="page-hero">
    <div class="page-wrap">
      <div class="crumbs"><a href="index.html">Home</a><svg class="ic" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg><span class="here">Log In</span></div>
      <h1>Welcome Back</h1>
      <p class="lead">Log in to check out faster and track your orders.</p>
    </div>
    <div class="hero-deco"></div>
  </section>

  <div class="page-wrap" style="max-width:560px">
    <div class="panel">
      <form id="loginForm" novalidate>
        <div class="field"><label for="liEmail">Email Address <span class="req">*</span></label><input id="liEmail" type="email" required placeholder="you@example.com" autocomplete="email"></div>
        <div class="field"><label for="liPass">Password <span class="req">*</span></label><input id="liPass" type="password" required placeholder="••••••••" autocomplete="current-password"></div>
        <button class="btn" type="submit" style="width:100%">LOG IN</button>
      </form>
      <p class="muted" style="margin:14px 0 0">No account yet? <a href="register.html"><b>Create one →</b></a></p>
    </div>
  </div>
</main>

<footer class="site-footer" id="vmFooter"></footer>
<div id="vmOverlays"></div>
