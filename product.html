<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Product details at Victor's Music — Nigeria's modern music store.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">

<body data-page="product">
<a class="skip-link" href="#vmMain">Skip to content</a>
<div class="topbar" id="vmTopbar"></div>
<header class="site-header" id="vmHeader"></header>

<main id="vmMain">
  <div class="page-wrap">
    <div class="breadcrumbs" id="pdCrumbs"></div>
  </div>

  <div id="pdWrap">
    <section class="page-wrap">
      <div class="pd-layout">
        <div class="pd-gallery">
          <img id="pdMainImg" src="" alt="Product image" class="pd-main-img">
          <div class="pd-thumbs" id="pdThumbs"></div>
          <p class="terms-note">Tap the main image to zoom.</p>
        </div>
        <div class="pd-info" id="pdInfoInner"></div>
      </div>
    </section>

    <section class="pd-sections page-wrap">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start" class="pd-two">
        <div class="panel">
          <h3 class="panel-title">📋 Description</h3>
          <div id="pdDescBody"></div>
        </div>
        <div class="panel">
          <h3 class="panel-title">⚙️ Specifications</h3>
          <div id="pdSpecsBody"></div>
        </div>
      </div>
    </section>

    <section class="pd-sections page-wrap">
      <div class="panel">
        <h3 class="panel-title">⭐ Customer Reviews</h3>
        <div id="pdReviewsBody"></div>
      </div>
    </section>

    <section class="section page-wrap">
      <div class="sec-head">
        <div><span class="kicker">You may also like</span><h2>Related Products</h2></div>
        <a class="link-all" href="shop.html">Browse more</a>
      </div>
      <div class="prod-grid" id="relRow"></div>
    </section>

    <section class="section page-wrap" style="padding-top:0">
      <div class="sec-head">
        <div><span class="kicker">Complete your setup</span><h2>Frequently Bought Together</h2>
        <p>Add all three at once and save 10% on the bundle.</p></div>
      </div>
      <div id="bundleWrap"></div>
    </section>
  </div>
</main>

<footer class="site-footer" id="vmFooter"></footer>
<div id="vmOverlays"></div>
